# keymap-drawer labels for hshs52.keymap (Mac symbols, names for macros).
# The drawing is regenerated by .github/workflows/draw.yml on keymap changes.
parse_config:
  modifier_fn_map:
    left_ctrl: "⌃"
    right_ctrl: "⌃"
    left_shift: "⇧"
    right_shift: "⇧"
    left_alt: "⌥"
    right_alt: "⌥"
    left_gui: "⌘"
    right_gui: "⌘"
    keycode_combiner: "{mods}{key}"
    mod_combiner: "{mod_1}{mod_2}"
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
  raw_binding_map:
    # home row mods
    "&hml LSHFT A": {t: A, h: "⇧"}
    "&hml LCTRL S": {t: S, h: "⌃"}
    "&hml LALT D": {t: D, h: "⌥"}
    "&hml LGUI F": {t: F, h: "⌘"}
    "&hml LS(LC(LA(LGUI))) G": {t: G, h: Hyper}
    "&hmr LS(LC(LA(LGUI))) H": {t: H, h: Hyper}
    "&hmr RGUI J": {t: J, h: "⌘"}
    "&hmr RALT K": {t: K, h: "⌥"}
    "&hmr RCTRL L": {t: L, h: "⌃"}
    "&hmr RSHFT SEMI": {t: ";", h: "⇧"}
    # hold for shortcuts
    "&hkz 0 Z": {t: Z, h: "⌘Tab"}
    "&hk LG(GRAVE) X": {t: X, h: "⌘`"}
    "&hk LG(C) C": {t: C, h: "⌘C"}
    "&hk LG(V) V": {t: V, h: "⌘V"}
    # plain modifiers (navi callum mods, base shift/ctrl/alt/gui keys)
    "&kp LSHFT": "⇧"
    "&kp RSHFT": "⇧"
    "&kp LCTRL": "⌃"
    "&kp RCTRL": "⌃"
    "&kp LALT": "⌥"
    "&kp LGUI": "⌘"
    "&kp RGUI": "⌘"
    "&kp LS(LC(LA(LGUI)))": Hyper
    "&kp LS(LCTRL)": "⇧⌃"
    "&kp LC(LALT)": "⌃⌥"
    "&kp LG(LALT)": "⌘⌥"
    "&sk LSHIFT": {t: "⇧", h: sticky}
    # accent layer
    "&acc_a": "á"
    "&acc_e": "é"
    "&acc_i": "í"
    "&acc_o": "ó"
    "&acc_u": "ú"
    "&acc_n": "ñ"
draw_config:
  dark_mode: auto
