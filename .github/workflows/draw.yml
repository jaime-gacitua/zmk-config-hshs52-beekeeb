# Redraws keymap-drawer/hshs52.svg (the cheat sheet in the README) when the keymap changes.
name: Draw keymap
on:
  workflow_dispatch:
  push:
    paths:
      - "config/boards/shields/hshs52/hshs52.keymap"
      - "config/boards/shields/hshs52/hshs52.dtsi"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw.yml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/boards/shields/hshs52/hshs52.keymap"
      draw_args: "hshs52:'-d config/boards/shields/hshs52/hshs52.dtsi -s Base Navi Symbols Accent Adjust'"
      commit_message: "keymap-drawer render"
